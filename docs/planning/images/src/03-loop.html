<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
.stage { position: relative; height: 380px; }
.stage .box { position: absolute; width: 230px; transform: translate(-50%, -50%); }
.stage svg { position: absolute; inset: 0; overflow: visible; }
.center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; font-size: 13px; font-weight: 800; }
.center span { display: block; font-size: 10.5px; font-weight: 400; color: #6b7280; }
</style><script>document.documentElement.className = 'v-' + (new URLSearchParams(location.search).get('v') || 'santa');</script>
</head>
<body style="width:1240px">
<h1>Christmas Gift For You · 루프 다이어그램 · <span class="only-santa">산타 버전</span><span class="only-fairy">요정 버전</span></h1>
<div class="sub">기준: design.md · 정책명세서.md (2026-11-19) · 실선 = 주 흐름 · 점선 = 다음 루프로 넘어가는 다리</div>
<div class="sec">A. 공개 트리 루프 — 걸고, 보고, 반응한다 (12/21 ~ 12/31)</div>
<div class="stage" id="a"></div>
<div class="sec">B. 비공개 그룹 루프 — 초대하고, 보내고, 함께 연다 (12/21 ~ 12/25)</div>
<div class="stage" id="b"></div>
<script>
function loop(el, nodes, cls, center, bridge, dashLast) {
  const W = 1184, H = 380, cx = W / 2, cy = H / 2, rx = 440, ry = 140, n = nodes.length;
  const pts = nodes.map((_, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]; });
  let svg = `<svg><defs><marker id="m${el}" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>`;
  pts.forEach((p, i) => {
    const q = pts[(i + 1) % n], sx = p[0] + (q[0] - p[0]) * .3, sy = p[1] + (q[1] - p[1]) * .3, ex = p[0] + (q[0] - p[0]) * .7, ey = p[1] + (q[1] - p[1]) * .7;
    const mx = (sx + ex) / 2 + (cx - (sx + ex) / 2) * -.12, my = (sy + ey) / 2 + (cy - (sy + ey) / 2) * -.12;
    svg += `<path d="M${sx},${sy} Q${mx},${my} ${ex},${ey}" stroke="#374151" stroke-width="2" fill="none" ${dashLast && i === n - 1 ? 'stroke-dasharray="6 5"' : ''} marker-end="url(#m${el})"/>`;
  });
  svg += '</svg>';
  document.getElementById(el).innerHTML = svg + nodes.map((t, i) => `<div class="box ${cls[i]}" style="left:${pts[i][0]}px;top:${pts[i][1]}px"><b>${t[0]}</b><span>${t[1]}</span></div>`).join('')
    + `<div class="center">${center}<span>${bridge}</span></div>`;
}
loop('a', [
  ['① 홈에서 트리를 본다', '비로그인도 열람 · 카드 50장 무작위'],
  ['② 카드를 넘겨 읽는다', '‹ › 다음 사람 카드 · 지인 적은 사람도 같은 기회'],
  ['③ ♥ 좋아요', '1인 1카드 1회 · 카드 수 제한 없음'],
  ['④ 반짝인다', '좋아요 5+ · 20 · 50 단계로 밝아짐'],
  ['⑤ 내 카드를 건다', '기본 카드 or 그리기 + 편지 · 1인 1장'],
  ['⑥ 내 카드 공유', '카드 링크 /c/{id} → 친구가 바로 열고 트리 구경 (P1)'],
], ['b-green f-green', 'b-green', 'b-red f-red', 'b-orange f-orange', 'b-green f-green', 'b-blue f-blue'],
 '성공 기준: 가입자 80% 이상 카드 걸기', '→ B 루프: 홈 [내 그룹] · 그룹 만들기로 넘어감 (분모가 전체 가입자라 중요)');
loop('b', [
  ['① 그룹을 만든다', '개수 제한 없음 · 만든 사람도 일반 멤버'],
  ['② 초대 링크 공유', '카톡 → 외부 브라우저 → 참여 (정원 30)'],
  (document.documentElement.className === 'v-fairy' ? ['③ 요정을 눌러 받는 사람 고르기', '요정 = 멤버 · 멤버 보기 목록 (디자인 검토 중)'] : ['③ 하늘 지도에서 집 고르기', '집 = 멤버 · 목록 보기로 찾기 (디자인 검토 중)']),
  ['④ 선물상자를 놓는다', '지정 or 마니또 · 편지·사진·음반'],
  ['⑤ 12/25 12:25 함께 개봉', '카톡 알림 · 마니또 공개'],
  ['⑥ 고마워요 답장 (P2)', '보낸 사람에게 도착 · 1/31 파기라 다음 해로는 안 이어짐'],
], ['b-red f-red', 'b-blue f-blue', 'b-orange f-orange', 'b-red f-red', 'b-purple f-purple', 'b-purple'],
 '성공 기준: 가입자 80% 이상 선물 1번 이상 · 그룹마다 안 만든 멤버 0', '마니또 = 받은 수 적은 멤버 우선 · 12/24 저녁 본인에게만 "아직 보낼 수 있어요" · ⑥→① 점선 = 약한 고리', true);
</script>
</body></html>
